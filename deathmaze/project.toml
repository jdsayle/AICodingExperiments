[project]
name = "deathmaze"
version = "0.1.0"
description = "A maze game project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    anyio==4.16.0,
    colorama==0.4.6,
    idna==3.20,
    iniconfig==2.3.1,
    Jinja2==3.1.6,
    MarkupSafe==3.0.4,
    packaging==26.3,
    pluggy==1.7.0,
    Pygments==2.21.0,
    PySide6==6.12.0,
    PySide6_Addons==6.12.0,
    PySide6_Essentials==6.12.0,
    PySide6_Pdf==6.12.0.140,
    PySide6_WebEngine==6.12.0.140,
    pytest==9.2.0,
    qt-material==2.17,
    shiboken6==6.12.0,
    typing_extensions==4.16.0,
    watchfiles==1.3.0,
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"